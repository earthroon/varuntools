name: Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_commit_sha:
        description: Exact source commit SHA to build when dispatched by VACMS publish
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve exact Pages source commit
        shell: bash
        env:
          DISPATCH_SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${DISPATCH_SOURCE_COMMIT_SHA:-}" ]; then
            if [ "${#DISPATCH_SOURCE_COMMIT_SHA}" -ne 40 ] || ! printf "%s" "$DISPATCH_SOURCE_COMMIT_SHA" | grep -Eq "^[0-9a-f]{40}$"; then
              echo "source_commit_sha must be a lowercase 40-hex commit SHA" >&2
              exit 1
            fi
            SOURCE_SHA="$DISPATCH_SOURCE_COMMIT_SHA"
          fi
          echo "PAGES_SOURCE_COMMIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Checkout exact Pages source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PAGES_SOURCE_COMMIT_SHA }}
          fetch-depth: 1

      - name: Verify exact Pages source commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$PAGES_SOURCE_COMMIT_SHA" ]; then
            echo "Pages checkout SHA mismatch: expected=$PAGES_SOURCE_COMMIT_SHA actual=$ACTUAL_SHA" >&2
            exit 1
          fi
          echo "pagesSourceCommitSha=$ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev --no-audit --fund=false --progress=false

      - name: Verify runtime dependencies
        run: |
          npm ls gray-matter
          test -f node_modules/gray-matter/index.js

      - name: Generate content inventory
        run: npm run content:page-inventory

      - name: Generate SEO outputs
        run: npm run seo:generate

      - name: Generate search index
        run: npm run search:generate

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
